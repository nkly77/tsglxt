<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图书管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar">
    <a href="{{ url_for('index') }}">图书列表</a>
    <a href="{{ url_for('add_book') }}">录入图书</a>
    <a href="{{ url_for('import_books') }}">批量导入</a>
    <a href="{{ url_for('search') }}">查询图书</a>
    <a href="{{ url_for('records') }}">借阅记录</a>
</nav>

<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
                <div class="flash {{ category }}">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>
</body>
</html>
