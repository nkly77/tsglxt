{% extends "base.html" %}
{% block content %}
<h2>录入图书</h2>
<form method="post" class="form">
    <label>书名：<input type="text" name="title" required></label>
    <label>作者：<input type="text" name="author" required></label>
    <label>ISBN：<input type="text" name="isbn" required></label>
    <label>分类：<input type="text" name="category" required></label>
    <label>库存数量：<input type="number" name="stock" min="0" value="0" required></label>
    <button type="submit">提交</button>
</form>
{% endblock %}
