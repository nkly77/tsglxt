{% extends "base.html" %}
{% block content %}
<h2>图书列表</h2>
<table>
    <thead>
        <tr>
            <th>ID</th><th>书名</th><th>作者</th><th>ISBN</th>
            <th>分类</th><th>库存</th><th>操作</th>
        </tr>
    </thead>
    <tbody>
    {% for b in books %}
        <tr>
            <td>{{ b.id }}</td>
            <td>{{ b.title }}</td>
            <td>{{ b.author }}</td>
            <td>{{ b.isbn }}</td>
            <td>{{ b.category }}</td>
            <td>{{ b.stock }}</td>
            <td>
                {% if b.stock > 0 %}
                    <a class="btn" href="{{ url_for('borrow_book', book_id=b.id) }}">借出</a>
                {% else %}
                    <span class="disabled">无库存</span>
                {% endif %}
                <form method="post" action="{{ url_for('delete_book', book_id=b.id) }}"
                      style="display:inline" onsubmit="return confirm('确定删除《{{ b.title }}》吗？');">
                    <button type="submit" class="btn btn-danger">删除</button>
                </form>
            </td>
        </tr>
    {% else %}
        <tr><td colspan="7">暂无图书，请先录入。</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
